name: Koe
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          touch log.txt
          echo "Hello world!!" > log.txt
      - uses: actions/upload-artifact@v7
        with:
          name: loggaus
          path: ./log.txt
  anotherjob:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: loggaus
      - run: touch log.txt
          
